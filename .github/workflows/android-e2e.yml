name: AndroidE2E

# Run on its own from Actions, or called by release.yml to gate the uploads.
on:
  workflow_dispatch:
  workflow_call:

# Not `release`: a called workflow in its caller's group is cancelled as a deadlock. Called from
# Release, github.workflow is the caller's name, so a standalone run never queues behind a release.
concurrency:
  group: ${{ github.workflow }}-android-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The 40 critical happy paths (app/androidApp/src/androidTest), on an Android emulator against the
  # Firebase emulators seeded from firebase/test/fixtures. Android only, but it gates both uploads:
  # the two apps share every line of logic it covers.
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_LEVEL: 34
    steps:
      - uses: actions/checkout@v5

      # The emulator's userdata partition does not fit in what the runner has left after the build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      # Temurin 21 also runs the Firestore emulator, which needs Java 21 or newer.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the Cloud Functions
        run: |
          npm ci --prefix firebase/functions
          npm run build --prefix firebase/functions

      - name: Install the Firebase CLI
        run: npm install --global firebase-tools@15.30.0

      # Built before the emulator boots, so its minutes are not spent waiting on Gradle.
      - name: Build the app and the tests
        run: ./gradlew :app:androidApp:assembleDebug :app:androidApp:assembleDebugAndroidTest

      - name: Cache the AVD
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-pixel_6-2G

      - name: Create the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          # The default 320x640 screen squashes the sign-in buttons to nothing.
          profile: pixel_6
          disk-size: 2G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated the AVD snapshot"

      # The runner executes each script line on its own, so the whole run is one line.
      - name: Run the E2E suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          # The default 320x640 screen squashes the sign-in buttons to nothing.
          profile: pixel_6
          disk-size: 2G
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd firebase && firebase emulators:exec --only auth,firestore,functions --project turnia-23ebc "cd .. && ./gradlew :app:androidApp:connectedDebugAndroidTest"

      - name: Upload the E2E report
        id: report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-e2e-report
          path: |
            app/androidApp/build/reports/androidTests/connected
            app/androidApp/build/outputs/androidTest-results/connected
            firebase/*-debug.log

      - name: Summarize the E2E results
        if: always()
        run: python3 .github/scripts/e2e-summary.py app/androidApp/build/outputs/androidTest-results/connected "${{ steps.report.outputs.artifact-url }}"
