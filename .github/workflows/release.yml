# Builds the release apps and uploads them: Android to Play's internal testing track, iOS to
# TestFlight. Promoting a build to production stays a click in each console.
#
# Run it from GitHub → Actions → Release → Run workflow. The secrets it needs are listed in
# .github/RELEASE.md.

name: Release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: Version name shown in the stores, e.g. 1.04
        type: string
        required: true

      platforms:
        description: Which apps to build and upload
        type: choice
        default: both
        options:
          - both
          - android
          - ios

      runTests:
        description: Run the Android E2E suite before uploading
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The version name is typed when the workflow is run; the build number is this run's, offset past
  # every build uploaded by hand before the pipeline existed.
  BUILD_NAME: ${{ inputs.versionName }}
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_NUMBER_OFFSET: 100

jobs:
  # App Store Connect only accepts up to three period-separated integers, and a bad name would only
  # be refused at the very end of the iOS job; Play takes the same format for consistency.
  validate:
    runs-on: ubuntu-latest
    outputs:
      buildNumber: ${{ steps.version.outputs.buildNumber }}
    steps:
      - name: Check the version name
        run: |
          if ! [[ "$BUILD_NAME" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Version name '$BUILD_NAME' must look like 1.04 or 1.4.0"
            exit 1
          fi

      # Computed once so both apps ship the same number, and shown on the run's summary page.
      - name: Resolve the version
        id: version
        run: |
          number=$((BUILD_NUMBER + BUILD_NUMBER_OFFSET))
          echo "buildNumber=$number" >> "$GITHUB_OUTPUT"
          echo "Version name: $BUILD_NAME"
          echo "Build number: $number (versionCode on Android, CFBundleVersion on iOS)"
          {
            echo "### Version"
            echo "| Version name | Build number |"
            echo "|---|---|"
            echo "| \`$BUILD_NAME\` | \`$number\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The 20 critical happy paths (app/androidApp/src/androidTest), on an Android emulator against the
  # Firebase emulators seeded from firebase/test/fixtures. Android only, but it gates both uploads:
  # the two apps share every line of logic it covers.
  android-e2e:
    needs: validate
    if: inputs.runTests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_LEVEL: 34
    steps:
      - uses: actions/checkout@v4

      # Temurin 21 also runs the Firestore emulator, which needs Java 21 or newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the Cloud Functions
        run: |
          npm ci --prefix firebase/functions
          npm run build --prefix firebase/functions

      - name: Install the Firebase CLI
        run: npm install --global firebase-tools@15.30.0

      # Built before the emulator boots, so its minutes are not spent waiting on Gradle.
      - name: Build the app and the tests
        run: ./gradlew :app:androidApp:assembleDebug :app:androidApp:assembleDebugAndroidTest

      - name: Cache the AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64

      - name: Create the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated the AVD snapshot"

      # The runner executes each script line on its own, so the whole run is one line.
      - name: Run the E2E suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd firebase && firebase emulators:exec --only auth,firestore,functions --project turnia-23ebc "cd .. && ./gradlew :app:androidApp:connectedDebugAndroidTest"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e-report
          path: |
            app/androidApp/build/reports/androidTests/connected
            app/androidApp/build/outputs/androidTest-results/connected
            firebase/*-debug.log

  android:
    needs: [validate, android-e2e]
    # Skipped E2E tests (runTests unticked) let the upload through; failed ones do not.
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.android-e2e.result) &&
      (inputs.platforms == 'both' || inputs.platforms == 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build the release bundle
        env:
          TURNIA_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          TURNIA_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          TURNIA_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          TURNIA_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          APP_BUILD_NUMBER: ${{ needs.validate.outputs.buildNumber }}
        run: |
          echo "Building versionName=$BUILD_NAME versionCode=$APP_BUILD_NUMBER"
          ./gradlew :app:androidApp:bundleRelease \
            -Pturnia.versionCode="$APP_BUILD_NUMBER" \
            -Pturnia.versionName="$BUILD_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            app/androidApp/build/outputs/bundle/release/*.aab
            app/androidApp/build/outputs/mapping/release/mapping.txt

      - name: Upload to Play (internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.geoviksoft.turnia
          releaseFiles: app/androidApp/build/outputs/bundle/release/androidApp-release.aab
          mappingFile: app/androidApp/build/outputs/mapping/release/mapping.txt
          track: internal
          status: completed

  ios:
    needs: [validate, android-e2e]
    # Skipped E2E tests (runTests unticked) let the upload through; failed ones do not.
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.android-e2e.result) &&
      (inputs.platforms == 'both' || inputs.platforms == 'ios')
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The "Compile Kotlin Framework" build phase runs Gradle from inside Xcode.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"

      # Automatic signing with the API key: Xcode fetches or creates the distribution certificate
      # and profile itself, so none of them live in the repo or in secrets.
      - name: Archive
        env:
          APP_BUILD_NUMBER: ${{ needs.validate.outputs.buildNumber }}
        run: |
          echo "Archiving MARKETING_VERSION=$BUILD_NAME CURRENT_PROJECT_VERSION=$APP_BUILD_NUMBER"
          xcodebuild archive \
            -project app/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/Turnia.xcarchive" \
            MARKETING_VERSION="$BUILD_NAME" \
            CURRENT_PROJECT_VERSION="$APP_BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Turnia.xcarchive" \
            -exportOptionsPlist app/iosApp/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
