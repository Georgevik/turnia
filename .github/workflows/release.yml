# Builds the release apps and uploads them: Android to Play's internal testing track, iOS to
# TestFlight. Promoting a build to production stays a click in each console.
#
# Run it from GitHub → Actions → Release → Run workflow. The secrets it needs are listed in
# .github/RELEASE.md.

name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "What kind of release: hotfix (1.2.3 → 1.2.4), minor (→ 1.3.0) or major (→ 2.0.0)"
        type: choice
        default: minor
        options:
          - hotfix
          - minor
          - major

      platforms:
        description: Which apps to build and upload
        type: choice
        default: both
        options:
          - both
          - android
          - ios

      runTests:
        description: Run the Android E2E suite before uploading
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The build number is this run's, offset past every build uploaded by hand before the pipeline
  # existed. The version name is worked out by the validate job from the last release tag.
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_NUMBER_OFFSET: 100

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      versionName: ${{ steps.version.outputs.versionName }}
      buildNumber: ${{ steps.version.outputs.buildNumber }}
    steps:
      # A release from any other branch would ship code nobody reviewed into the stores.
      - name: Check the branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases can only be made from main. Choose main in 'Use workflow from' and run it again."
          exit 1

      # Only for its credentials: the tags are read from the remote, which a shallow clone lacks.
      - uses: actions/checkout@v5

      # The last release is the highest v<major>.<minor>.<patch>-<build> tag, which the tag job
      # writes once a release has gone out; a run that failed partway left none, so re-running it
      # arrives at the same version. Computed once so both apps ship the same name and number.
      - name: Resolve the version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          last=$(git ls-remote --tags --refs origin 'v*' \
            | sed 's|.*refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$' \
            | sort -V | tail -n 1)
          if [ -z "$last" ]; then
            echo "::error::No previous release tag (like v1.2.3-250) was found, so there is nothing to count from."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          patch=${patch%%-*}
          case "$RELEASE" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            hotfix) patch=$((patch + 1)) ;;
          esac
          BUILD_NAME="$major.$minor.$patch"
          number=$((BUILD_NUMBER + BUILD_NUMBER_OFFSET))
          echo "versionName=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "buildNumber=$number" >> "$GITHUB_OUTPUT"
          echo "Previous release: $last ($RELEASE)"
          echo "Version name: $BUILD_NAME"
          echo "Build number: $number (versionCode on Android, CFBundleVersion on iOS)"
          {
            echo "### Version"
            echo "| Version name | Build number | Release | Previous |"
            echo "|---|---|---|---|"
            echo "| \`$BUILD_NAME\` | \`$number\` | $RELEASE | \`$last\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Warn that the tests were skipped
        if: ${{ !inputs.runTests }}
        run: |
          echo "::warning::The tests were skipped: this build is uploaded without being tested."
          {
            echo "### ⚠️ Tests skipped"
            echo "This build is uploaded **without running the tests**. Check it by hand before promoting it."
          } >> "$GITHUB_STEP_SUMMARY"

  # The 68 critical happy paths, on an Android emulator against the Firebase emulators. Android only,
  # but it gates both uploads: the two apps share every line of logic it covers.
  android-e2e:
    needs: validate
    if: inputs.runTests
    uses: ./.github/workflows/android-e2e.yml
    secrets: inherit

  android:
    needs: [validate, android-e2e]
    # Skipped E2E tests (runTests unticked) let the upload through; failed ones do not.
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.android-e2e.result) &&
      (inputs.platforms == 'both' || inputs.platforms == 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_NAME: ${{ needs.validate.outputs.versionName }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      # google-services.json is not in git (see app/androidApp/google-services.json.example);
      # CI decodes it from a repo secret instead.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/androidApp/google-services.json

      - name: Build the release bundle
        env:
          TURNIA_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          TURNIA_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          TURNIA_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          TURNIA_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          APP_BUILD_NUMBER: ${{ needs.validate.outputs.buildNumber }}
        run: |
          echo "Building versionName=$BUILD_NAME versionCode=$APP_BUILD_NUMBER"
          ./gradlew :app:androidApp:bundleRelease \
            -Pturnia.versionCode="$APP_BUILD_NUMBER" \
            -Pturnia.versionName="$BUILD_NAME"

      - uses: actions/upload-artifact@v5
        with:
          name: android-release
          path: |
            app/androidApp/build/outputs/bundle/release/*.aab
            app/androidApp/build/outputs/mapping/release/mapping.txt

      - name: Upload to Play (internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.geoviksoft.turnia
          releaseFiles: app/androidApp/build/outputs/bundle/release/androidApp-release.aab
          mappingFile: app/androidApp/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: .github/whatsnew
          tracks: internal
          status: completed

  ios:
    needs: [validate, android-e2e]
    # Skipped E2E tests (runTests unticked) let the upload through; failed ones do not.
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.android-e2e.result) &&
      (inputs.platforms == 'both' || inputs.platforms == 'ios')
    runs-on: macos-26
    timeout-minutes: 90
    env:
      BUILD_NAME: ${{ needs.validate.outputs.versionName }}
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      # The "Compile Kotlin Framework" build phase runs Gradle from inside Xcode.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # GoogleService-Info.plist is not in git (see the .example in the same folder); CI decodes it
      # from a repo secret instead.
      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > app/iosApp/iosApp/GoogleService-Info.plist

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Import the signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$RUNNER_TEMP/cert.p12"

      # Automatic signing with the imported certificate: Xcode reuses it and only has to fetch or
      # renew the matching provisioning profile through the API key.
      - name: Archive
        env:
          APP_BUILD_NUMBER: ${{ needs.validate.outputs.buildNumber }}
        run: |
          echo "Archiving MARKETING_VERSION=$BUILD_NAME CURRENT_PROJECT_VERSION=$APP_BUILD_NUMBER"
          xcodebuild archive \
            -project app/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/Turnia.xcarchive" \
            MARKETING_VERSION="$BUILD_NAME" \
            CURRENT_PROJECT_VERSION="$APP_BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Turnia.xcarchive" \
            -exportOptionsPlist app/iosApp/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

  # A TestFlight upload carries no notes, unlike Play's, so they are added once the build is there.
  testflight-notes:
    needs: [validate, ios]
    if: ${{ !cancelled() && needs.ios.result == 'success' }}
    uses: ./.github/workflows/release-notes.yml
    with:
      buildNumber: ${{ needs.validate.outputs.buildNumber }}
      platforms: ios
    secrets: inherit

  # Marks the commit that shipped, once every chosen upload has succeeded. A run that failed partway
  # gets its tag from the "Re-run failed jobs" that finishes it.
  tag:
    needs: [validate, android, ios]
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      (inputs.platforms == 'ios' || needs.android.result == 'success') &&
      (inputs.platforms == 'android' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Tag the release
        env:
          TAG: v${{ needs.validate.outputs.versionName }}-${{ needs.validate.outputs.buildNumber }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG ($PLATFORMS)" "$GITHUB_SHA"
          git push origin "$TAG"
          echo "### Tagged \`$TAG\` ($PLATFORMS)" >> "$GITHUB_STEP_SUMMARY"

      # The README's version badge and "what's new" link point at the GitHub Release, not the bare
      # tag, so it needs a real Release object with a body — reruns just update it in place.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.validate.outputs.versionName }}-${{ needs.validate.outputs.buildNumber }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          {
            cat .github/whatsnew/whatsnew-en-GB
            echo
            echo
            echo "Platforms: $PLATFORMS"
          } > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
