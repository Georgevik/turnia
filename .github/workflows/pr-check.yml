name: PR check

# The gate on every pull request to main: it compiles both apps, runs the common tests, checks the
# Cloud Functions, the OpenSpec changes and the production guard, and runs the Android E2E suite
# (android-e2e.yml) unless every changed file is on .github/e2e-ignored-paths.txt. Branch protection
# matches on the pr- job names below, so keep them stable; the pr- prefix keeps any other workflow's
# job from satisfying them.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same pull request cancels the run it makes obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The debug app, plus the common tests of core and app/shared on the JVM host.
  pr-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Every Gradle build configures androidApp, which reads google-services.json. A pull request
      # from a fork gets no secrets, and compiling needs no real project, so it uses the example.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash .github/scripts/write-google-services.sh

      - name: Build the debug app and run the common tests
        run: ./gradlew :app:androidApp:assembleDebug :core:testAndroidHostTest :app:shared:testAndroidHostTest

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: |
            core/build/reports/tests
            app/shared/build/reports/tests

  # The only check iOS gets: the shared Kotlin compiled for the simulator, without Xcode linking it.
  pr-ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash .github/scripts/write-google-services.sh

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Compile the shared Kotlin for iosSimulatorArm64
        run: ./gradlew :app:shared:compileKotlinIosSimulatorArm64

  # Everything outside Gradle: the Cloud Functions, the OpenSpec changes and specs, the guard hook.
  pr-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Build the Cloud Functions
        run: |
          npm ci --prefix firebase/functions
          npm run build --prefix firebase/functions

      # Not --strict: it fails on the "requirement text is very long" warnings older specs carry.
      - name: Validate the OpenSpec changes and specs
        run: npx --yes @fission-ai/openspec@1.14.3 validate --all --no-interactive

      - name: Test the production guard
        run: python3 .claude/hooks/test_guard_production.py

      - name: Test which pull requests skip the E2E suite
        run: python3 .github/scripts/test_e2e_needed.py

  # Whether the E2E suite has to run: not when every file the pull request changes is on the ignore
  # list. HEAD is the pull request merged into main and HEAD^1 is main, so their diff is exactly what
  # the pull request would change. --no-renames lists both sides of a move, so moving app code into an
  # ignored path still runs the suite. An empty list, or any other event, runs the suite.
  e2e-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Decide whether the E2E suite runs
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "run=true" | tee -a "$GITHUB_OUTPUT"
          else
            git diff --name-only --no-renames HEAD^1 HEAD | tee /dev/stderr | python3 .github/scripts/e2e_needed.py .github/e2e-ignored-paths.txt
          fi

  e2e:
    needs: e2e-paths
    if: needs.e2e-paths.outputs.run == 'true'
    uses: ./.github/workflows/android-e2e.yml
    secrets: inherit

  # The check branch protection requires, rather than e2e itself: a skipped caller of a reusable
  # workflow reports under another name than the one it reports when it runs, so a required e2e
  # would wait forever on every pull request that skips the suite. Not always(): a run cancelled by a
  # newer push reports nothing, rather than a red check on the commit it made obsolete.
  pr-e2e:
    needs: [e2e-paths, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the E2E result
        env:
          PATHS_RESULT: ${{ needs.e2e-paths.result }}
          RUN: ${{ needs.e2e-paths.outputs.run }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "Skip decision: $PATHS_RESULT (run=$RUN). E2E suite: $E2E_RESULT."
          if [ "$PATHS_RESULT" = success ] && [ "$RUN" = false ] && [ "$E2E_RESULT" = skipped ]; then
            echo "### E2E skipped: every changed file is on .github/e2e-ignored-paths.txt" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$PATHS_RESULT" = success ] && [ "$E2E_RESULT" = success ]; then
            exit 0
          fi
          echo "::error::The E2E suite did not pass (skip decision: $PATHS_RESULT, suite: $E2E_RESULT)."
          exit 1
